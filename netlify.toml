# Netlify deployment configuration for Kwesi Arthur fan site
# SPA: all routes must serve index.html so the React app can handle them

[build]
  command     = "npm run build"
  publish     = "dist"

[build.environment]
  NODE_VERSION = "20"

# ── SPA redirect — required for client-side routing ──────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security headers ─────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"
    # CSP: allow YouTube embeds and external image sources (iTunes CDN, Wikimedia)
    Content-Security-Policy   = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://i.ytimg.com https://is1-ssl.mzstatic.com https://upload.wikimedia.org https://thumb.wikimedia.org; frame-src https://www.youtube.com; connect-src 'self';"

# ── Cache static assets aggressively ─────────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Do not cache index.html ───────────────────────────────────────────────
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
